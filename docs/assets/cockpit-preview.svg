  <text x="342" y="149" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="14">How does MemoryMappedVectorDatabase avoid heap copies?</text>

  <rect x="324" y="186" width="588" height="200" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="344" y="214" fill="#38bdf8" font-family="Consolas, monospace" font-size="12">[SSE STREAM • X-Correlation-ID: 8f94c2b1 • Context: &lt;untrusted_context&gt; sanitized]</text>
  <text x="344" y="246" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="14">MemoryMappedVectorDatabase writes contiguous float32 embeddings after a</text>
  <text x="344" y="270" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="14">16-byte ZCRV header and maps the file via MemoryMappedFile. During search,</text>
  <text x="344" y="294" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="14">it acquires the OS page-cache pointer and wraps it directly as a</text>
  <text x="344" y="318" fill="#38bdf8" font-family="Consolas, monospace" font-size="14">ReadOnlySpan&lt;float&gt; scored via TensorPrimitives.CosineSimilarity.</text>
  <text x="344" y="356" fill="#64748b" font-family="Consolas, monospace" font-size="12">Source: memory-mapped-vectors.md (Page 1, Score: 0.984) ▋</text>

