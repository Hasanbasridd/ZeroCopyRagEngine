services:
  rag-engine:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - AiProvider__Provider=Ollama
      - AiProvider__Endpoint=http://ollama:11434
      - AiProvider__ChatModel=llama3.2
      - AiProvider__EmbeddingModel=nomic-embed-text
      - Security__RequireAuthentication=false
      - Security__MaxQueryLength=2000
      - Security__PermitLimitPerMinute=60
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:

