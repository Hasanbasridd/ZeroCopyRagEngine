name: Cyber-Guard

# Server-side enforcement of the zero-allocation rules (Madde 4.3).
# Runs both the Roslyn heap-allocation analyzer and the banned-method scan
# (which covers yield-return iterator bodies skipped by ClrHeapAllocationAnalyzer),
# so `git commit --no-verify` cannot bypass it.

on:
  push:
    branches: [ main, master, 'test/**', 'feature/**', 'pr/**' ]
  pull_request:

jobs:
  allocation-analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore ZeroCopyRagEngine.sln

      - name: Build (HAA* diagnostics in Chunkers/ and VectorStores/ are errors)
        run: dotnet build ZeroCopyRagEngine.sln --no-restore -c Release

      - name: Banned-method scan (same rule as .githooks/pre-commit, with allow-span-split exception)
        run: |
          VIOLATIONS=$(grep -rnE '\.Select\(|\.ToList\(|\.Split\(' \
            ZeroCopyRagEngine.Infrastructure/Chunkers \
            ZeroCopyRagEngine.Infrastructure/VectorStores \
            | grep -vE '\.Split\(.*// cyber-guard: allow-span-split \(.+\)' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "🚨 CYBER-GUARD ALERT: Banned method detected in hot path:"
            echo "$VIOLATIONS"
            exit 1
          fi
