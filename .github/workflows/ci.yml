name: CI

on:
  push:
    branches: [ main, 'feature/**', 'pr/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-eval:
    name: Build, Test, Coverage & RAG Eval (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore ZeroCopyRagEngine.sln

      - name: Build (Analyzer Errors Enforced)
        run: dotnet build ZeroCopyRagEngine.sln -c Release --no-restore

      - name: Test with Coverlet Coverage (Excluding Live Integration Tests)
        run: dotnet test ZeroCopyRagEngine.sln -c Release --no-build --filter "Category!=Integration" --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Run Golden Dataset RAG Evaluation Gate
        if: hashFiles('datasets/golden-dataset.json') != ''
        run: dotnet run --project ZeroCopyRagEngine.Benchmarks -c Release --no-build -- --eval datasets/golden-dataset.json

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: ./TestResults/**/coverage.cobertura.xml
